<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>שלושה קצבים — תצוגת מובייל</title>
<style>
html,body{margin:0;height:100%;background:#1a120d;font-family:system-ui,sans-serif;color:#f5f5f5}
body{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:24px;box-sizing:border-box}
.phone{width:390px;height:min(844px,calc(100vh - 90px));border-radius:44px;padding:12px;background:#000;box-shadow:0 30px 80px rgba(0,0,0,.5)}
iframe{width:100%;height:100%;border:0;border-radius:34px;background:#f5f5f5}
nav{display:flex;gap:12px;font-size:14px}
a{color:#f5f5f5;opacity:.75}
a:hover{color:#EE3A30;opacity:1}
@media (max-width:500px){body{padding:0}.phone{width:100%;height:100vh;border-radius:0;padding:0}iframe{border-radius:0}nav{display:none}}
</style>
</head>
<body>
<nav><a href="index.html">דסקטופ</a><span>·</span><strong>מובייל</strong></nav>
<div class="phone"><iframe src="index.html" title="שלושה קצבים — מובייל"></iframe></div>
</body>
</html>
